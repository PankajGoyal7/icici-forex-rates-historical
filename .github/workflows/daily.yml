name: Fetch ICICI Forex Card Rates

on:
  schedule:
    # 10:00 IST = 04:30 UTC, Mon-Sat.
    # ICICI publishes/refreshes the card rate sheet on working days around
    # 09:15 IST, so this gives it a comfortable buffer. Adjust as needed.
    - cron: "30 4 * * 1-6"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-fetch even if today's rates were already captured"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  fetch-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch rates
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python scripts/fetch_icici_rates.py --force
          else
            python scripts/fetch_icici_rates.py
          fi

      - name: Commit and push if there are changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add ICICI forex card rates for $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: Upload snapshot as build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icici-rate-snapshot
          path: data/snapshots/
          retention-days: 7
